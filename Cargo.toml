[package]
name = "telegram-notifier"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "Daemon and CLI client that deliver notifications to Telegram"
authors = ["Oleguer Serra <oleguer@serra.cat>"]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/oleguerserra/telegram-notifier"

[lib]
name = "telegram_notifier"
path = "src/lib.rs"

[[bin]]
name = "telegram-notifierd"
path = "src/bin/telegram-notifierd.rs"

[[bin]]
name = "telegram-notify"
path = "src/bin/telegram-notify.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
nix = { version = "0.29", features = ["user", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
